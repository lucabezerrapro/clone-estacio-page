<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Diplomas | Estácio</title>
    <!-- CSS Refactored to external file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <img src="img/estacio.png" alt="Logo Estácio">
        </div>
    </header>

    <main class="container">
        <!-- Student Information & Status -->
        <section class="info-section">
            <div class="info-left">
                <h1 id="student-name">Carregando...</h1>
                <div class="dados-cols">
                    <div class="dados-col">
                        <p><strong>CPF:</strong> <span id="student-cpf">...</span></p>
                        <p><strong>Data de Nascimento:</strong> <span id="student-birth">...</span></p>
                    </div>
                    <div class="dados-col">
                        <p><strong>Naturalidade:</strong> <span id="student-naturalness">...</span></p>
                        <p><strong>RG:</strong> <span id="student-rg">...</span></p>
                        <p><strong>Sexo:</strong> <span id="student-sex">...</span></p>
                    </div>
                </div>
            </div>
            <div class="status-badge">
                Status do diploma: <strong id="diploma-status">...</strong>
            </div>
        </section>

        <!-- Diploma Viewer & Actions -->
        <section class="diploma-section">
            <!-- Diploma Viewer -->
            <div class="diploma-viewer">
                <div class="diploma-scroll">
                    <div class="diploma-image-wrapper">
                        <img src="img/certified.png" alt="Diploma Certificado">
                    </div>
                </div>
            </div>

            <!-- Actions Sidebar -->
            <aside class="actions-sidebar">
                <div class="btn-row">
                    <button id="btn-xml" class="btn btn-xml">Baixar XML</button>
                    <button id="btn-rvdd" class="btn btn-rvdd">Baixar RVDD</button>
                </div>
                <a href="https://verificadordiplomadigital.mec.gov.br/diploma" target="_blank" class="btn btn-conformidade">Portal de conformidade do XML</a>
                <button id="btn-ies" class="btn btn-outline">Dados da IES Emissora</button>
                <button id="btn-curso" class="btn btn-outline">Dados do Curso</button>
                <button id="btn-registro" class="btn btn-outline">Dados do Registro</button>
            </aside>
        </section>
    </main>

    <!-- Logic Refactored to external file following SOLID principles -->
    <script src="script.js"></script>
</body>
</html>
